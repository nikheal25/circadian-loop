<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12141c"/>
      <stop offset="55%" stop-color="#161a26"/>
      <stop offset="100%" stop-color="#1b2133"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3d4a6b"/>
      <stop offset="42%" stop-color="#7aa2f7"/>
      <stop offset="72%" stop-color="#bb9af7"/>
      <stop offset="100%" stop-color="#3d4a6b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1100" height="300" fill="url(#bg)"/>
  <ellipse cx="830" cy="145" rx="300" ry="190" fill="url(#glow)"/>

  <!-- horizon -->
  <line x1="620" y1="186" x2="1050" y2="186" stroke="#2a3145" stroke-width="1.5"/>

  <!-- the cycle: an orbit crossing the horizon, day above, night below -->
  <ellipse cx="835" cy="186" rx="150" ry="80" fill="none" stroke="url(#arc)" stroke-width="2.5"/>

  <!-- sun, above the horizon -->
  <circle cx="905" cy="126" r="15" fill="#7aa2f7"/>
  <circle cx="905" cy="126" r="26" fill="none" stroke="#7aa2f7" stroke-width="1.2" opacity="0.45"/>

  <!-- moon, below the horizon -->
  <path d="M 762 246 a 12 12 0 1 0 11 -11 a 9.5 9.5 0 0 1 -11 11 z" fill="#bb9af7"/>

  <!-- tick marks around the orbit -->
  <g fill="#4d5878">
    <circle cx="685" cy="186" r="2.6"/>
    <circle cx="985" cy="186" r="2.6"/>
    <circle cx="835" cy="106" r="2.6"/>
    <circle cx="835" cy="266" r="2.6"/>
  </g>

  <!-- labels on the orbit -->
  <text x="835" y="94" fill="#6b7694" font-size="13" letter-spacing="2.4" text-anchor="middle">WORK</text>
  <text x="835" y="288" fill="#6b7694" font-size="13" letter-spacing="2.4" text-anchor="middle">SLEEP</text>

  <!-- wordmark -->
  <text x="70" y="128" fill="#e6ebff" font-size="62" font-weight="700" letter-spacing="-1.6">Circadian Loop</text>
  <text x="72" y="172" fill="#8b96b8" font-size="21" letter-spacing="0.2">One goal. Endless cycles. A context window that never fills.</text>

  <g transform="translate(72, 205)">
    <rect x="0" y="0" width="132" height="30" rx="15" fill="#1e2534" stroke="#2f3850"/>
    <text x="66" y="20" fill="#7aa2f7" font-size="13" font-weight="600" text-anchor="middle">pi extension</text>
    <rect x="144" y="0" width="96" height="30" rx="15" fill="#1e2534" stroke="#2f3850"/>
    <text x="192" y="20" fill="#bb9af7" font-size="13" font-weight="600" text-anchor="middle">+ skill</text>
    <rect x="252" y="0" width="126" height="30" rx="15" fill="#1e2534" stroke="#2f3850"/>
    <text x="315" y="20" fill="#9ece6a" font-size="13" font-weight="600" text-anchor="middle">no build step</text>
  </g>
</svg>
